<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bataan Hero Defender - Town Background Preview</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { display: block; margin: 16px auto; border: 3px solid #ffd700; border-radius: 8px; image-rendering: pixelated; }
    .controls { margin-top: 10px; }
    button { padding: 10px 18px; margin: 4px; font-size: 14px; font-weight: bold; cursor: pointer; background: #ffd700; border: none; border-radius: 6px; }
    button:hover { background: #ffea70; }
  </style>
</head>
<body>
  <h2>Bataan Hero Defender — 12 Towns Background Switcher</h2>
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <div class="controls">
    <button id="prevBtn">⬅️ Previous Town</button>
    <button id="nextBtn">Next Town ➡️</button>
  </div>
  <p>Tip: Buksan ito gamit ang VS Code Live Server para gumana ang ES6 modules.</p>

  <script type="module">
    import { TownBackgroundManager } from "./src/townBackgroundManager.js";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const townManager = new TownBackgroundManager();

    document.getElementById("prevBtn").addEventListener("click", () => townManager.prevTown());
    document.getElementById("nextBtn").addEventListener("click", () => townManager.nextTown());

    let lastTime = performance.now();
    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      townManager.update(dt);
      townManager.draw(ctx, canvas.width, canvas.height);

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
